name: Release

# Push a tag like v1.0.0 to build, sign, notarize, and publish a DMG.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Import signing certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          # Word splitting is intended: each existing keychain becomes its own argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build and sign
        env:
          VERSION: ${{ github.ref_name }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          plutil -replace CFBundleShortVersionString -string "$V" Keel/Info.plist
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" Keel/Info.plist
          xcodebuild \
            -project Keel.xcodeproj \
            -scheme Keel \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Keel.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN --timestamp" \
            archive | xcbeautify
          cp -R "$RUNNER_TEMP/Keel.xcarchive/Products/Applications/Keel.app" Keel.app
          codesign --verify --strict --verbose=2 Keel.app
          codesign -d --entitlements - Keel.app

      - name: Notarize app
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          ditto -c -k --keepParent Keel.app notarize.zip
          xcrun notarytool submit notarize.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple Keel.app
          spctl --assess --type execute --verbose=4 Keel.app

      - name: Package and notarize DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          cp -R Keel.app "$STAGE/Keel.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Keel -srcfolder "$STAGE" -ov -format UDZO Keel.dmg
          codesign --force --timestamp --sign "Developer ID Application" --keychain "$KEYCHAIN" Keel.dmg
          xcrun notarytool submit Keel.dmg \
            --key "$NOTARY_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          xcrun stapler staple Keel.dmg
          spctl --assess --type open --context context:primary-signature --verbose=4 Keel.dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Keel.dmg --generate-notes --title "Keel $GITHUB_REF_NAME"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
